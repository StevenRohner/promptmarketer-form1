name: Read IBAN format reference
on:
  push:
    branches: [feat/international-iban]
    paths: [.github/workflows/iban-reference-check.yml]
permissions: {}
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public format metadata (no account data or credentials)
        shell: python
        run: |
          import urllib.request, json, hashlib
          url = 'https://raw.githubusercontent.com/mdomke/schwifty/main/schwifty/iban_registry/generated.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(1000000)
          data = json.loads(raw)
          specs = {k:[v['iban_length'],v['bban_spec']] for k,v in data.items() if v['iban_spec'].startswith(k)}
          print(json.dumps({'source':url,'sha256':hashlib.sha256(raw).hexdigest(),'formats':specs},ensure_ascii=True))
